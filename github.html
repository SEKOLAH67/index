<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Olahraga Jutawan</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0c1027; color: white; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .quiz-container { background: #161c3a; border: 2px solid #3b4b8c; border-radius: 12px; width: 100%; max-width: 800px; padding: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #2d3867; padding-bottom: 10px; }
        .lifelines button { background: #2a366f; color: #ffcc00; border: 1px solid #ffcc00; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .lifelines button:disabled { opacity: 0.3; cursor: not-allowed; }
        .question-box { background: linear-gradient(180deg, #1f2954 0%, #0f1531 100%); border: 2px solid #4a5b9d; border-radius: 8px; padding: 20px; text-align: center; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .option-btn { background: #1a234a; border: 1px solid #3d4f8d; border-radius: 20px; color: white; padding: 15px; font-size: 1rem; text-align: left; cursor: pointer; transition: 0.2s; }
        .option-btn:hover { background: #2a3875; border-color: #ffcc00; }
        .info-panel { margin-top: 20px; display: flex; justify-content: space-between; font-weight: bold; color: #ffcc00; }
        .status-msg { text-align: center; font-size: 1.1rem; margin-top: 15px; height: 30px; color: #00ffcc; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>Kuis Olahraga Jutawan</h2>
        <div class="lifelines">
            <button id="btn-5050" onclick="use5050()">50:50</button>
            <button id="btn-audience" onclick="useAudience()">👥 Penonton</button>
            <button id="btn-phone" onclick="usePhone()">📞 Telepon</button>
        </div>
    </div>

    <div class="info-panel">
        <span id="level-txt">Pertanyaan: 1 / 5</span>
        <span id="prize-txt">Hadiah: $100</span>
    </div>

    <div class="question-box" id="question">Pertanyaan akan muncul di sini...</div>

    <div class="options-grid" id="options">
        <button class="option-btn" onclick="checkAnswer(0)">A. </button>
        <button class="option-btn" onclick="checkAnswer(1)">B. </button>
        <button class="option-btn" onclick="checkAnswer(2)">C. </button>
        <button class="option-btn" onclick="checkAnswer(3)">D. </button>
    </div>

    <div class="status-msg" id="status"></div>
</div>

<script>
    const quizData = [
        {
            q: "Berapa jumlah pemain dalam satu tim sepak bola di lapangan?",
            options: ["A. 9 Orang", "B. 10 Orang", "C. 11 Orang", "D. 12 Orang"],
            correct: 2,
            prize: "$100"
        },
        {
            q: "Induk organisasi bola basket internasional adalah...",
            options: ["A. FIFA", "B. FIBA", "C. BWF", "D. IAAF"],
            correct: 1,
            prize: "$500"
        },
        {
            q: "Negara manakah yang memenangkan Piala Dunia FIFA 2022?",
            options: ["A. Prancis", "B. Brasil", "C. Jerman", "D. Argentina"],
            correct: 3,
            prize: "$1.000"
        },
        {
            q: "Ukuran tinggi net untuk bola voli putra adalah...",
            options: ["A. 2.24 meter", "B. 2.43 meter", "C. 2.50 meter", "D. 2.15 meter"],
            correct: 1,
            prize: "$10.000"
        },
        {
            q: "Siapakah pemegang rekor lari 100 meter tercepat di dunia?",
            options: ["A. Usain Bolt", "B. Tyson Gay", "C. Yohan Blake", "D. Justin Gatlin"],
            correct: 0,
            prize: "$1.000.000"
        }
    ];

    let currentLevel = 0;
    let currentQ = quizData[currentLevel];

    function loadQuestion() {
        currentQ = quizData[currentLevel];
        document.getElementById("level-txt").innerText = `Pertanyaan: ${currentLevel + 1} / ${quizData.length}`;
        document.getElementById("prize-txt").innerText = `Hadiah: ${currentQ.prize}`;
        document.getElementById("question").innerText = currentQ.q;
        
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach((btn, idx) => {
            btn.innerText = currentQ.options[idx];
            btn.style.visibility = "visible";
            btn.disabled = false;
        });
    }

    function checkAnswer(selectedIdx) {
        if (selectedIdx === currentQ.correct) {
            document.getElementById("status").innerText = "Jawaban BENAR!";
            currentLevel++;
            
            if (currentLevel < quizData.length) {
                setTimeout(() => {
                    document.getElementById("status").innerText = "";
                    loadQuestion();
                }, 1500);
            } else {
                document.getElementById("question").innerText = "SELAMAT! Anda Menjadi Jutawan Olahraga!";
                document.getElementById("options").style.display = "none";
                document.getElementById("status").innerText = "Hadiah Utama: $1.000.000";
            }
        } else {
            document.getElementById("status").innerText = "Jawaban SALAH! Permainan Selesai.";
            disableAllOptions();
        }
    }

    function disableAllOptions() {
        const buttons = document.querySelectorAll(".option-btn");
        buttons.forEach(btn => btn.disabled = true);
    }

    // Bantuan 50:50
    function use5050() {
        document.getElementById("btn-5050").disabled = true;
        const buttons = document.querySelectorAll(".option-btn");
        let removed = 0;
        
        buttons.forEach((btn, idx) => {
            if (idx !== currentQ.correct && removed < 2) {
                btn.style.visibility = "hidden";
                removed++;
            }
        });
    }

    // Bantuan Penonton
    function useAudience() {
        document.getElementById("btn-audience").disabled = true;
        const letter = ["A", "B", "C", "D"][currentQ.correct];
        alert(`Hasil Voting Penonton: Kebanyakan memilih jawaban (${letter})`);
    }

    // Bantuan Telepon
    function usePhone() {
        document.getElementById("btn-phone").disabled = true;
        const letter = ["A", "B", "C", "D"][currentQ.correct];
        alert(`Teman Anda berkata: "Saya lumayan yakin jawabannya adalah (${letter})!"`);
    }

    // Mulai game pertama kali
    loadQuestion();
</script>

</body>
</html>
